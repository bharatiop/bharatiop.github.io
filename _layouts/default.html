<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}NAP Lab @ NIT Rourkela</title>
  <meta name="description" content="{{ page.excerpt | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.url }}{{ site.baseurl }}/css/main.css">
  {% seo %}
</head>
<body>

{% include header.html %}

<main class="page-content">
  {{ content }}
</main>

{% include footer.html %}

<script>
  const menuBtn = document.getElementById('menuBtn');
  const navLinks = document.getElementById('navLinks');
  if (menuBtn) menuBtn.addEventListener('click', () => {
    navLinks.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', navLinks.classList.contains('open'));
  });

  /* Full-width publication slider (ICTS-style auto-scroll) */
  (function () {
    const root = document.getElementById('pubSlider');
    if (!root) return;

    const slides = Array.from(root.querySelectorAll('.pub-slide'));
    const dotsWrap = document.getElementById('pubSliderDots');
    const progress = document.getElementById('pubSliderProgress');
    const prevBtn = document.getElementById('pubSliderPrev');
    const nextBtn = document.getElementById('pubSliderNext');
    if (!slides.length) return;

    let index = 0;
    let raf = null;
    let running = false;
    let started = 0;
    const INTERVAL = 5500;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    slides.forEach((_, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pub-slider-dot' + (i === 0 ? ' is-active' : '');
      b.setAttribute('aria-label', 'Go to slide ' + (i + 1));
      b.addEventListener('click', () => go(i));
      dotsWrap.appendChild(b);
    });
    const dots = Array.from(dotsWrap.children);

    function go(i) {
      index = (i + slides.length) % slides.length;
      slides.forEach((s, k) => s.classList.toggle('is-active', k === index));
      dots.forEach((d, k) => d.classList.toggle('is-active', k === index));
      started = performance.now();
      if (progress) progress.style.width = '0%';
    }

    function next() { go(index + 1); }
    function prev() { go(index - 1); }

    function tick(now) {
      if (!running) return;
      const t = Math.min(1, (now - started) / INTERVAL);
      if (progress) progress.style.width = (t * 100) + '%';
      if (t >= 1) go(index + 1);
      raf = requestAnimationFrame(tick);
    }

    function start() {
      if (reduceMotion || running) return;
      running = true;
      started = performance.now();
      raf = requestAnimationFrame(tick);
    }

    function stop() {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      raf = null;
    }

    prevBtn && prevBtn.addEventListener('click', () => { prev(); started = performance.now(); });
    nextBtn && nextBtn.addEventListener('click', () => { next(); started = performance.now(); });

    root.addEventListener('mouseenter', stop);
    root.addEventListener('mouseleave', start);
    root.addEventListener('focusin', stop);
    root.addEventListener('focusout', start);

    let touchX = null;
    root.addEventListener('touchstart', (e) => {
      touchX = e.changedTouches[0].clientX;
      stop();
    }, { passive: true });
    root.addEventListener('touchend', (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
      touchX = null;
      start();
    }, { passive: true });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stop(); else start();
    });

    go(0);
    start();
  })();
</script>
</body>
</html>

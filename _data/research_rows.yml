# ==========================================================================
# Homepage "Four questions driving the lab" rows.
#
# To add, remove, or reorder a row: just edit this list — the homepage
# rebuilds itself automatically, no HTML editing needed.
#
# Fields:
#   image     - path relative to the site root (put files in /images/papers/)
#   alt       - describe the figure for screen readers / SEO
#   citation  - short label shown as a pill on top of the image
#   number    - "01", "02", ... shown above the heading
#   label     - short category name shown next to the number
#   question  - the heading (kept as a question works best)
#   body      - list of paragraphs; each becomes its own <p>
#   tags      - list of short topic tags shown as pills
#   link_text - text for the "Read more" link (optional, defaults below)
#   link_url  - where it points (optional, defaults to /research)
# ==========================================================================

- image: /images/papers/eos_mr.png
  alt: "Mass–radius curves for neutron stars constrained by GW170817 and pulsar observations"
  citation: "Phys. Rev. D 99, 123026"
  number: "01"
  label: "Equation of State"
  question: "How stiff is matter at five times nuclear density?"
  body:
    - "The equation of state fixes how much mass a neutron star can hold before it collapses. We build relativistic mean-field models of dense nuclear matter and push them against the hard limits set by two-solar-mass pulsars, GW170817's tidal deformability, and NICER's radius measurements."
    - "The models that survive all three tell us something no terrestrial experiment can."
  tags: ["RMF theory", "Mass–radius", "Tidal deformability"]

- image: /images/papers/gw_fmode.png
  alt: "Correlation matrix relating f- and p-mode oscillation frequencies to nuclear matter parameters"
  citation: "Phys. Rev. D 106, 063005"
  number: "02"
  label: "Asteroseismology"
  question: "Can we hear a star's interior in how it rings?"
  body:
    - "A perturbed neutron star oscillates in distinct modes — f, p and g — each carrying a fingerprint of the matter inside it. We compute those frequencies and damping times, then trace which nuclear parameters actually control them."
    - "Next-generation detectors should resolve these modes. We are working out what they will say when they do."
  tags: ["Non-radial modes", "Quasinormal modes", "GW spectroscopy"]

- image: /images/papers/dm_posterior.jpeg
  alt: "Bayesian mass–radius posterior distributions for dark matter admixed neutron stars"
  citation: "MNRAS 525, 5492"
  number: "03"
  label: "Dark Matter"
  question: "What if dark matter is already inside the star?"
  body:
    - "Neutron stars accrete dark matter over billions of years. If enough accumulates, it changes the star's radius, its tidal response, and the frequency at which it oscillates — all of it observable."
    - "We model admixed configurations and run Bayesian inference against real data to find where the signature would be strong enough to detect."
  tags: ["WIMPs", "Bayesian inference", "Admixed stars"]

- image: /images/papers/hyperons_delta.png
  alt: "Effective masses of nucleons and delta baryons in dense nuclear matter"
  citation: "JCAP 04, 065"
  number: "04"
  label: "Exotic Phases"
  question: "Do nucleons survive at all in the core?"
  body:
    - "Deep enough inside, it becomes energetically cheaper to make hyperons, Δ-baryons, or to deconfine into quark matter altogether. Every one of those options softens the equation of state and shifts what the star looks like."
    - "We work out which exotic phases stay consistent with the observations — and which are already ruled out."
  tags: ["Hyperons", "Δ-baryons", "Quarkyonic matter"]

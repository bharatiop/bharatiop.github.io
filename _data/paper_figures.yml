# ==========================================================================
# "Selected results" figure gallery on the homepage.
#
# To add a new paper figure: drop the image in /images/papers/ and add a
# block below. To remove one, delete its block. Order here is display order.
# No HTML editing required — the gallery grid rebuilds itself.
#
# Fields:
#   image     - path relative to the site root
#   alt       - describe the figure (screen readers / SEO)
#   title     - short caption shown in bold under the image
#   citation  - text shown on the link, e.g. "Phys. Rev. D 99, 123026 (2019)"
#   url       - link target, usually the DOI or journal page
# ==========================================================================


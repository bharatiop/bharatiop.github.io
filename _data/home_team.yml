# ==========================================================================
# "The researchers" snapshot grid on the homepage.
#
# Add, remove, or reorder team members by editing this list — no HTML
# editing needed. Photos go in /images/teampic/. If a photo is missing or
# fails to load, the initials in `initials:` are shown instead automatically.
#
# Fields:
#   name      - full display name
#   photo     - path relative to site root
#   initials  - 2-letter fallback shown if the photo fails to load
#   role      - shown under the name (use <br> for a line break)
#   tag       - single topic tag (use tag_class: tag-amber for alumni, etc.)
#   tag_class - optional, e.g. "tag-amber" (defaults to plain "tag")
#   links     - list of {label, url}
# ==========================================================================

